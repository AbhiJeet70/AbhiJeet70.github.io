<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Abhijeet Dhali - computer science graduate student, AI researcher, and technical professional."
    />
    <meta
      name="keywords"
      content="Abhijeet Dhali, Portfolio, Machine Learning, Graph Neural Networks, Technical Support, Research"
    />
    <meta name="author" content="Abhijeet Dhali" />
    <title>Abhijeet Dhali | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              ink: "#111827",
              surface: "#f7f8fb",
              accent: "#0f766e"
            },
            boxShadow: {
              soft: "0 16px 60px rgba(15, 23, 42, 0.10)"
            }
          }
        }
      };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        text-rendering: optimizeLegibility;
        scroll-behavior: smooth;
      }

      :root.dark {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #f7f8fb;
      }

      .dark body {
        background: #0f172a;
      }

      ::selection {
        background: rgba(15, 118, 110, 0.22);
      }

      .mesh-bg {
        background-image:
          linear-gradient(rgba(15, 118, 110, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 118, 110, 0.08) 1px, transparent 1px);
        background-size: 44px 44px;
      }

      .dark .mesh-bg {
        background-image:
          linear-gradient(rgba(45, 212, 191, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(45, 212, 191, 0.08) 1px, transparent 1px);
      }

      .role-marquee {
        animation: floatText 16s linear infinite;
      }

      @keyframes floatText {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      section,
      footer {
        scroll-margin-top: 82px;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          transition-duration: 1ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="src/data/portfolio-data.js"></script>
    <script type="text/babel" data-presets="react" src="src/main.jsx"></script>
  </body>
</html>
